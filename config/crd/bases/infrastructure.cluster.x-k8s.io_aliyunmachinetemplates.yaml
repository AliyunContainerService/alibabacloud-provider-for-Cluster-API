---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
  name: aliyunmachinetemplates.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: AliyunMachineTemplate
    listKind: AliyunMachineTemplateList
    plural: aliyunmachinetemplates
    shortNames:
    - alimpctl
    singular: aliyunmachinetemplate
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.template.spec.instanceType
      name: INSTANCE
      type: string
    - jsonPath: .spec.template.spec.vSwitchId
      name: VSWITCH
      priority: 1
      type: string
    - jsonPath: .spec.template.spec.regionId
      name: REGION
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1beta2
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              template:
                description: Template 为创建 AliyunMachine（单机规格）的模板。
                properties:
                  metadata:
                    type: object
                  spec:
                    description: |-
                      AliyunMachineSpec —— 你的控制器会把这些字段映射到 Upjet ecs.Instance.spec.forProvider
                      以及把 Bootstrap 的 userData Secret 透传为 Upjet 的 user_data。
                    properties:
                      dataDisks:
                        description: 数据盘配置
                        items:
                          description: DataDiskSpec（可选）映射 InstanceParameters.data_disks[*]
                          properties:
                            category:
                              type: string
                            deleteWithInstance:
                              type: boolean
                            description:
                              type: string
                            device:
                              type: string
                            encrypted:
                              type: boolean
                            kmsKeyId:
                              type: string
                            name:
                              type: string
                            performanceLevel:
                              type: string
                            size:
                              format: int32
                              type: integer
                            snapshotId:
                              type: string
                          type: object
                        type: array
                      imageId:
                        description: 镜像 ID（如公共镜像/自定义镜像）
                        type: string
                      instanceChargeType:
                        description: 计费类型：PostPaid / PrePaid（不写默认 PostPaid）
                        type: string
                      instanceType:
                        description: 实例规格
                        type: string
                      internetChargeType:
                        description: 计费类型：PayByBandwidth / PayByTraffic（不写默认 PayByTraffic）
                        type: string
                      internetMaxBandwidthIn:
                        description: 公网入带宽
                        format: int32
                        type: integer
                      internetMaxBandwidthOut:
                        description: |-
                          公网出带宽，Mbps。为 0 表示仅私网
                          对应 InstanceParameters.InternetMaxBandwidthOut
                        format: int32
                        type: integer
                      keyName:
                        description: 登录密钥对名称（设置后通常禁用密码登录）
                        type: string
                      privateIp:
                        description: 可选：实例私网 IP（不指定则自动分配）
                        type: string
                      providerID:
                        type: string
                      regionId:
                        description: 地域，如 cn-hangzhou
                        type: string
                      securityGroupIds:
                        description: |-
                          安全组 ID 列表
                          对应 InstanceParameters.SecurityGroups
                        items:
                          type: string
                        type: array
                      systemDisk:
                        description: |-
                          ---------------- 磁盘 ----------------
                          系统盘配置
                        properties:
                          autoSnapshotPolicyId:
                            type: string
                          category:
                            description: |-
                              类别：cloud_efficiency / cloud_ssd / cloud_essd / cloud_auto ...
                              对应 InstanceParameters.SystemDiskCategory
                            type: string
                          description:
                            type: string
                          encryptAlgorithm:
                            type: string
                          encrypted:
                            description: 是否加密/算法/KMS
                            type: boolean
                          kmsKeyId:
                            type: string
                          name:
                            type: string
                          performanceLevel:
                            description: ESSD 性能等级：PL0/PL1/PL2/PL3
                            type: string
                          size:
                            format: int32
                            type: integer
                        type: object
                      tags:
                        additionalProperties:
                          type: string
                        description: 资源标签：会同步到 Upjet Instance.tags
                        type: object
                      vSwitchId:
                        description: 交换机（子网）ID（必填，除非你支持经典网络）
                        type: string
                      volumeTags:
                        additionalProperties:
                          type: string
                        description: 写入到磁盘设备的标签（Upjet Instance.volume_tags）
                        type: object
                    required:
                    - instanceType
                    - regionId
                    - vSwitchId
                    type: object
                required:
                - spec
                type: object
            required:
            - template
            type: object
          status:
            type: string
        type: object
    served: true
    storage: true
    subresources:
      status: {}
