          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of AliyunMachinePool
            properties:
              providerID:
                type: string
              scalingConfiguration:
                description: 伸缩配置：等同于 ScalingConfiguration
                properties:
                  imageId:
                    type: string
                  instanceTypes:
                    items:
                      type: string
                    minItems: 1
                    type: array
                  internetChargeType:
                    description: 'Network billing type, Values: PayByBandwidth or
                      PayByTraffic. Default to PayByBandwidth.'
                    type: string
                  internetMaxBandwidthIn:
                    description: Maximum incoming bandwidth from the public network,
                      measured in Mbps (Mega bit per second). The value range is [1,200].
                    type: number
                  internetMaxBandwidthOut:
                    description: Maximum outgoing bandwidth from the public network,
                      measured in Mbps (Mega bit per second). The value range for
                      PayByBandwidth is [0,1024].
                    type: number
                  scalingGroupId:
                    type: string
                  securityGroupIds:
                    items:
                      type: string
                    minItems: 1
                    type: array
                  systemDiskCategory:
                    description: … 如果需要，还可以加更多字段，如 RAM Role、磁盘配置 …
                    type: string
                  systemDiskSize:
                    type: number
                  userData:
                    type: string
                required:
