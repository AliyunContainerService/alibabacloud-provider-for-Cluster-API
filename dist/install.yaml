                    items:
                      type: string
                    type: array
                  maxSize:
                    minimum: 1
                    type: integer
                  minSize:
                    type: integer
                  scalingGroupName:
                    description: Name shown for the scaling group, which must contain
                      2-64 characters (English or Chinese), starting with numbers,
                      English letters or Chinese characters, and can contain numbers,
                      underscores _, hyphens -, and decimal points .. If this parameter
                      is not specified, the default value is ScalingGroupId.
                    type: string
                  vswitchIds:
                    description: vswitch 可以和配置里的 vSwitch 对应，也可独立
                    items:
                      type: string
                    minItems: 1
                    type: array
                required:
                - desiredCapacity
                - maxSize
                - minSize
                - vswitchIds
                type: object
            required:
            - scalingConfiguration
            - scalingGroup
            type: object
          status:
            description: status defines the observed state of AliyunMachinePool
            properties:
              conditions:
                description: Conditions defines current service state of the AliyunMachinePool.
                items:
                  description: Condition defines an observation of a Cluster API resource
                    operational state.
                  properties:
                    lastTransitionTime:
                      description: |-
                        Last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed. If that is not known, then using the time when
                        the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A human readable message indicating details about the transition.
                        This field may be empty.
                      type: string
                    reason:
                      description: |-
                        The reason for the condition's last transition in CamelCase.
                        The specific API may choose whether or not this field is considered a guaranteed API.
                        This field may not be empty.
                      type: string
                    severity:
                      description: |-
                        Severity provides an explicit classification of Reason code, so the users or machines can immediately
                        understand the current situation and act accordingly.
                        The Severity field MUST be set only when Status=False.
                      type: string
                    status:
                      description: Status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: |-
                        Type of condition in CamelCase or in foo.example.com/CamelCase.
                        Many .condition.type values are consistent across resources like Available, but because arbitrary conditions
                        can be useful (see .node.status.conditions), the ability to deconflict is important.
                      type: string
                  required:
                  - lastTransitionTime
                  - status
                  - type
                  type: object
                type: array
              readyReplicas:
                description: ReadyReplicas is the number of replicas that are ready
                  and have a corresponding Kubernetes NodeReady condition.
                format: int32
                type: integer
              replicas:
                description: Replicas is the total number of instances in the ScalingGroup.
                format: int32
                type: integer
              scalingConfigurationID:
                description: ScalingConfigurationID is the ID of the ESS ScalingConfiguration
                  used by the ScalingGroup.
                type: string
