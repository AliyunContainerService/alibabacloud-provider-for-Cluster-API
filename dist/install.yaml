  names:
    kind: AliyunMachinePool
    listKind: AliyunMachinePoolList
    plural: aliyunmachinepools
    singular: aliyunmachinepool
  scope: Namespaced
  versions:
  - name: v1beta2
    schema:
      openAPIV3Schema:
        description: AliyunMachinePool is the Schema for the aliyunmachinepools API
