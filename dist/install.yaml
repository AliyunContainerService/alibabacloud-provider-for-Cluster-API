              providerID:
                type: string
              regionId:
                description: 地域，如 cn-hangzhou
                type: string
              securityGroupIds:
                description: |-
                  安全组 ID 列表
                  对应 InstanceParameters.SecurityGroups
                items:
                  type: string
                type: array
              systemDisk:
                description: |-
                  ---------------- 磁盘 ----------------
                  系统盘配置
                properties:
                  autoSnapshotPolicyId:
                    type: string
                  category:
                    description: |-
                      类别：cloud_efficiency / cloud_ssd / cloud_essd / cloud_auto ...
                      对应 InstanceParameters.SystemDiskCategory
                    type: string
                  description:
                    type: string
                  encryptAlgorithm:
                    type: string
                  encrypted:
                    description: 是否加密/算法/KMS
                    type: boolean
                  kmsKeyId:
                    type: string
                  name:
                    type: string
                  performanceLevel:
                    description: ESSD 性能等级：PL0/PL1/PL2/PL3
                    type: string
                  size:
                    format: int32
                    type: integer
